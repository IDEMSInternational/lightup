@let s = state();
@let v = view();

<svg
  class="board-svg"
  #svg
  role="img"
  [attr.aria-label]="'Light Up puzzle, ' + s.w + ' by ' + s.h"
  [attr.viewBox]="viewBox()"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="cancelTouch()"
  (contextmenu)="$event.preventDefault()"
>
  <rect class="board-paper" x="0" y="0" [attr.width]="s.w" [attr.height]="s.h" rx="0.2" />

  <!-- Lit squares stay inside the paper's rounded corners. -->
  <clipPath [attr.id]="clipId">
    <rect x="0.02" y="0.02" [attr.width]="s.w - 0.04" [attr.height]="s.h - 0.04" rx="0.18" />
  </clipPath>
  <g [attr.clip-path]="'url(#' + clipId + ')'">
    @for (q of v.litSquares; track $index) {
      <rect class="lit" [attr.x]="q.x" [attr.y]="q.y" width="1" height="1" />
    }
  </g>

  @for (l of gridLines(); track $index) {
    <line class="board-grid" [attr.x1]="l.x1" [attr.y1]="l.y1" [attr.x2]="l.x2" [attr.y2]="l.y2" />
  }

  @for (b of v.blacks; track $index) {
    <g class="black" [class.wrong]="b.wrong">
      <rect [attr.x]="b.x + 0.04" [attr.y]="b.y + 0.04" width="0.92" height="0.92" rx="0.14" />
      @if (b.number !== null) {
        <text [attr.x]="b.x + 0.5" [attr.y]="b.y + 0.53">{{ b.number }}</text>
      }
    </g>
  }

  @if (hintView(); as h) {
    @for (q of h.squares; track $index) {
      <rect
        class="board-hint"
        [attr.x]="q.x + 0.07"
        [attr.y]="q.y + 0.07"
        width="0.86"
        height="0.86"
        rx="0.15"
      />
    }
  }

  @for (d of v.dots; track $index) {
    <circle
      class="dot"
      [class.going]="d.going"
      [attr.cx]="d.x + 0.5"
      [attr.cy]="d.y + 0.5"
      r="0.09"
    />
  }

  @for (d of v.newDots; track $index) {
    <circle class="dot new" [attr.cx]="d.x + 0.5" [attr.cy]="d.y + 0.5" r="0.09" />
  }

  @for (l of v.lights; track $index) {
    <g class="light" [class.wrong]="l.wrong">
      <circle class="glow" [attr.cx]="l.x + 0.5" [attr.cy]="l.y + 0.5" r="0.4" />
      <circle class="bulb" [attr.cx]="l.x + 0.5" [attr.cy]="l.y + 0.5" r="0.27" />
    </g>
  }

  @if (hintView(); as h) {
    @if (!drag()) {
      @if (h.gesture === 'drag') {
        <circle class="board-finger" r="0.22">
          <animateMotion
            [attr.path]="h.path"
            dur="2s"
            repeatCount="indefinite"
            keyPoints="0;0;1;1"
            keyTimes="0;0.2;0.8;1"
            calcMode="linear"
          />
        </circle>
      } @else {
        <circle class="board-finger tap" [attr.cx]="h.centre.x" [attr.cy]="h.centre.y" r="0.22" />
      }
    }
  }

  @if (noteLabel(); as label) {
    <g class="board-label note" role="status">
      <rect
        [attr.x]="label.x"
        [attr.y]="label.y"
        [attr.width]="label.width"
        [attr.height]="label.height"
        [attr.rx]="label.height / 2"
      />
      <text [attr.x]="label.x + label.width / 2" [attr.y]="label.y + label.height / 2 + 0.02">
        {{ label.text }}
      </text>
    </g>
  }
</svg>
